name: IntunixSample
options:
  bundleIdPrefix: com.intunix
  deploymentTarget:
    iOS: "15.0"
packages:
  Intunix:
    path: ..
targets:
  IntunixSample:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Intunix
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.intunix.sample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
